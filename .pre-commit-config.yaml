minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: r-style
        name: Check R formatting with styler
        entry: Rscript dev/precommit.R style
        language: system
        pass_filenames: true
        files: ^(R|tests|vignettes|data-raw|dev)/.*\.[Rr](md)?$|^README\.Rmd$|^\.Rprofile$

      - id: r-lint
        name: Lint changed R files with lintr
        entry: Rscript dev/precommit.R lint
        language: system
        pass_filenames: true
        files: ^(R|tests|vignettes|data-raw|dev)/.*\.[Rr](md)?$|^README\.Rmd$|^\.Rprofile$|^\.lintr$

      - id: rmarkdown-rendered
        name: Check R Markdown outputs are rendered
        entry: Rscript dev/precommit.R rmarkdown
        language: system
        pass_filenames: true
        files: ^README\.(Rmd|md)$

      - id: readiness-large-files
        name: Block oversized repository files
        entry: Rscript inst/scripts/readiness-checks.R large-files
        language: system
        pass_filenames: true

      - id: readiness-debt-markers
        name: Require issue links for debt markers
        entry: Rscript inst/scripts/readiness-checks.R debt-markers
        language: system
        pass_filenames: true

      - id: readiness-agents-links
        name: Validate AGENTS.md local links
        entry: Rscript inst/scripts/readiness-checks.R agents-links
        language: system
        pass_filenames: true

      - id: readiness-code-quality
        name: Enforce repository code-quality budgets
        entry: Rscript inst/scripts/readiness-checks.R code-quality
        language: system
        pass_filenames: true

      - id: r-tests
        name: Run package tests before push
        entry: Rscript dev/precommit.R test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
