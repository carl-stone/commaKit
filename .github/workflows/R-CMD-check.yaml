# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Check R and Bioconductor versions
        run: |
          Rscript -e 'cat("R ", as.character(getRversion()), "\n", sep = "")'
          Rscript -e 'cat("Bioconductor ", as.character(BiocManager::version()), "\n", sep = "")'

      - name: Install check system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ghostscript qpdf

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: any::rcmdcheck, local::.
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  BiocCheck:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v4

      - name: Check R and Bioconductor versions
        run: |
          Rscript -e 'cat("R ", as.character(getRversion()), "\n", sep = "")'
          Rscript -e 'cat("Bioconductor ", as.character(BiocManager::version()), "\n", sep = "")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: bioc::BiocCheck, local::.
          needs: check

      - name: Run BiocCheck
        run: |
          status <- system2(
            "R",
            c("CMD", "build", "--no-build-vignettes", "--no-manual", ".")
          )
          if (!identical(status, 0L)) {
            stop("R CMD build failed with status ", status)
          }
          tarball <- Sys.glob("commaKit_*.tar.gz")
          stopifnot(length(tarball) == 1L)
          BiocCheck::BiocCheck(
            tarball,
            `no-check-bioc-help` = TRUE,
            `quit-with-status` = TRUE
          )
        shell: Rscript {0}
