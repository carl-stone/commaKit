name: Build performance tracking

on:
  schedule:
    - cron: "17 10 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Collect recent workflow durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$REPOSITORY" \
            --limit 200 \
            --status completed \
            --json workflowName,conclusion,createdAt,updatedAt,event \
            > runs.json

          ruby <<'RUBY' > build-performance.md
          require "json"
          require "time"

          tracked = [
            "R-CMD-check.yaml",
            "pkgdown.yaml",
            "render-rmarkdown.yaml",
            "style.yaml",
            "lintr.yaml",
            "test-timing.yaml",
            "Test coverage threshold",
            "Repository hygiene checks",
            "Automated security review"
          ]

          def percentile(values, pct)
            return nil if values.empty?
            sorted = values.sort
            index = ((pct / 100.0) * (sorted.length - 1)).round
            sorted[index]
          end

          runs = JSON.parse(File.read("runs.json"))
          puts "## Build Performance Report"
          puts
          puts "Recent completed workflow runs from the last #{runs.length} runs sampled. Durations include queue and execution time."
          puts
          puts "| Workflow | Successes sampled | Failures sampled | Avg seconds | Median seconds | P90 seconds | Max seconds |"
          puts "|---|---:|---:|---:|---:|---:|---:|"

          tracked.each do |workflow|
            samples = runs.select { |run| run["workflowName"] == workflow }
            successes = samples.select { |run| run["conclusion"] == "success" && run["createdAt"] && run["updatedAt"] }.first(20)
            failures = samples.count { |run| !["success", "skipped"].include?(run["conclusion"]) }
            next if successes.empty? && failures == 0

            durations = successes.map do |run|
              Time.parse(run["updatedAt"]) - Time.parse(run["createdAt"])
            end
            if durations.empty?
              puts "| #{workflow} | 0 | #{failures} | n/a | n/a | n/a | n/a |"
            else
              avg = durations.sum / durations.length
              puts "| #{workflow} | #{durations.length} | #{failures} | #{avg.round(1)} | #{percentile(durations, 50).round(1)} | #{percentile(durations, 90).round(1)} | #{durations.max.round(1)} |"
            end
          end
          RUBY

          cat build-performance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build performance report
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-report
          path: |
            runs.json
            build-performance.md
          retention-days: 30
