# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    name: pkgdown
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v5

      - name: Check R and Bioconductor versions
        run: |
          Rscript -e 'cat("R ", as.character(getRversion()), "\n", sep = "")'
          Rscript -e 'cat("Bioconductor ", as.character(BiocManager::version()), "\n", sep = "")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: |
          pkgdown::build_site(new_process = FALSE, install = FALSE)
          file.create(file.path("docs/_site", ".nojekyll"))
        shell: Rscript {0}

      - name: Upload pkgdown site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-site
          path: docs/_site
          retention-days: 14

  pkgdown-deploy:
    name: pkgdown deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-deploy-${{ github.ref }}
      cancel-in-progress: true
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v5

      - name: Check R and Bioconductor versions
        run: |
          Rscript -e 'cat("R ", as.character(getRversion()), "\n", sep = "")'
          Rscript -e 'cat("Bioconductor ", as.character(BiocManager::version()), "\n", sep = "")'

      - name: Install deploy system tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rsync

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: |
          pkgdown::build_site(new_process = FALSE, install = FALSE)
          file.create(file.path("docs/_site", ".nojekyll"))
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs/_site
