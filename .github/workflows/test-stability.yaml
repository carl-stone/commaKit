name: Test stability sampling

on:
  schedule:
    - cron: "41 10 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  test-stability:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - uses: actions/checkout@v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: local::.
          needs: check

      - name: Run stability sample
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2; do
            echo "Running test stability pass ${pass}"
            Rscript dev/test-timing.R > "test-stability-pass-${pass}.txt" 2>&1
            mv test-timing-report.csv "test-stability-pass-${pass}.csv"
          done

      - name: Summarize stability sample
        if: always()
        run: |
          {
            echo "## Test Stability Sampling"
            echo ""
            echo "The package test suite is run twice from a clean checkout."
            echo "Any pass failure marks this workflow failed and flags possible flakiness."
            echo ""
            for pass in 1 2; do
              if [ -f "test-stability-pass-${pass}.csv" ]; then
                total=$(awk -F, 'NR > 1 { sum += $2 } END { printf "%.2f", sum }' "test-stability-pass-${pass}.csv")
                echo "- Pass ${pass}: ${total}s"
              else
                echo "- Pass ${pass}: no timing report produced"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-stability-report
          path: |
            test-stability-pass-*.csv
            test-stability-pass-*.txt
          retention-days: 30
