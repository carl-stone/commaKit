name: Test coverage threshold

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22@sha256:e34177896c1579f66d48b756e4229b58237499183a089da084af72d7aba1d40a
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
      COMMAKIT_MIN_COVERAGE: "50"
      COMMAKIT_SOURCE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          packages: any::sessioninfo
          extra-packages: local::., any::covr
          needs: check

      - name: Enforce coverage threshold
        shell: Rscript {0}
        run: |
          coverage <- covr::package_coverage(type = "tests")
          percent <- covr::percent_coverage(coverage)
          threshold <- as.numeric(Sys.getenv("COMMAKIT_MIN_COVERAGE", "50"))
          message(sprintf("Coverage: %.2f%%, threshold: %.2f%%", percent, threshold))
          if (percent < threshold) {
            stop(sprintf(
              "Coverage %.2f%% is below required threshold %.2f%%",
              percent,
              threshold
            ))
          }
          covr::to_cobertura(coverage, filename = "coverage.xml")

      - name: Add coverage summary
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo ""
            echo "Coverage threshold: ${COMMAKIT_MIN_COVERAGE}%"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
