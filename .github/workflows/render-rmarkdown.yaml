# Check that committed Markdown outputs match changed R Markdown sources.
on:
  push:
    branches: [main, master]
    paths:
      - '**.Rmd'
      - '**.md'
      - '.github/workflows/render-rmarkdown.yaml'
  pull_request:
    paths:
      - '**.Rmd'
      - '**.md'
      - '.github/workflows/render-rmarkdown.yaml'

name: render-rmarkdown.yaml

permissions: read-all

jobs:
  render-rmarkdown:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:RELEASE_3_22
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check R and Bioconductor versions
        run: |
          Rscript -e 'cat("R ", as.character(getRversion()), "\n", sep = "")'
          Rscript -e 'cat("Bioconductor ", as.character(BiocManager::version()), "\n", sep = "")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::sessioninfo
          extra-packages: local::., any::rmarkdown

      - name: Determine changed R Markdown files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$head")"
          fi

          git diff --name-only "$base" "$head" -- '*.Rmd' '*.md' > changed-rmd-files.txt
          cat changed-rmd-files.txt

      - name: Check rendered R Markdown outputs
        shell: bash
        run: |
          mapfile -t files < changed-rmd-files.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed R Markdown files to check."
            exit 0
          fi
          Rscript dev/precommit.R rmarkdown "${files[@]}"
